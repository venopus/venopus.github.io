 для защиты от электрической дуги? (ИПИСЗ п.4.6.1)","o":["Для защиты тела работающего от воздействия электрической дуги, которая может возникнуть при оперативных переключениях в действующих электроустановках всех классов напряжения","для защиты тела работающего от воздействия низких температур при оперативных переключениях в действующих электроустановках всех классов напряжения","для защиты тела работающего от воздействия повышенных температур при оперативных переключениях в действующих электроустановках всех классов напряжения","для защиты тела работающего от воздействия электрической дуги, которая может возникнуть при оперативных переключениях в действующих электроустановках выше 1000 В"],"c":[0],"t":"single"},{"q":"Допускается ли применение алюминиевых лестниц в ЗРУ?","o":["Допускается в ЭУ выше 220кВ","Допускается в ЭУ до 35 кВ","Допускается в ЭУ до 1000 В","Не допускается"],"c":[0],"t":"single"},{"q":"Доступная прикосновению проводящая часть электроустановки, нормально не находящаяся под напряжением, но которая может оказаться под напряжением при повреждении основной изоляции – это … (ПУЭ п.1.7.9)","o":["Токоведущая часть","Доступная проводящая часть","Сторонняя проводящая часть","Открытая проводящая часть","Токопроводящая часть"],"c":[3],"t":"single"},{"q":"Заземляющее устройство – совокупность … Выберите все правильные ответы (ПУЭ п. 1.7.19)","o":["Главная заземляющая шина","Защитный проводники","Заземляющие проводники","Заземлитель"],"c":[2,3],"t":"multi"},{"q":"К какой категории относится плакат \"Заземлено\"?","o":["Плакат предписывающий","Плакат предупреждающий","Плакат запрещающий","Плакат указательный"],"c":[3],"t":"single"},{"q":"К какой категории относиться плакат «РАБОТАТЬ ЗДЕСЬ»? (ИПИСЗ прил. 9)","o":["Плакат предписывающий","Плакат предупреждающий","Плакат запрещающий","Плакат указательный"],"c":[0],"t":"single"},{"q":"Как должно работать эвакуационное освещение? Выберите все правильные ответы (п.4З.ППР РФ)","o":["Должно включаться автоматически при прекращении электропитания рабочего освещения","Должно находиться в круглосуточном режиме работы","Должно включаться вручную при прекращении электропитания рабочего освещения","Должна быть мигающая стрелка в направлении выхода"],"c":[0,1],"t":"multi"},{"q":"Как могут допускаться работники, не обслуживающие ЭУ, в ЭУ напряжением до 1000 В?","o":["В сопровождении оперативного персонала, обслуживающего данную электроустановку, имеющего группу III, либо работника, имеющего право единоличного осмотра"],"c":[0],"t":"single"},{"q":"Какая информация должна быть обозначена на переносных заземлениях? Выберите все правильные ответы (ИПИСЗ п. 2.17.10.)","o":["Инвентарный номер","Номинальное напряжение электроустановки","Максимальный ток короткого замыкания, обеспечивающий термическую стойкость","Сечение проводов"],"c":[0,1,3],"t":"multi"},{"q":"Какая максимальная длинна гибкого кабеля, соединяющего переносную (передвижную) электросварочную установку с коммутационным аппаратом? (ПТЭЭП п.3.1.11)","o":["не более 25м","не более 20м","не более 15м","не более 10м"],"c":[2],"t":"single"},{"q":"Какие действия при оказании первой помощи пострадавшему от эл.тока?","o":["После освобождения пострадавшего от действия электрическо­го тока необходимо оценить его состояние"],"c":[0],"t":"single"},{"q":"Какие действия при оказании первой помощи при термических и электрических ожогах? Выберите все правильные ответы (ИОТ 0-01 п.11.10.1)","o":["При оказании помощи пострадавшему нельзя касаться обожженных участков кожи или смазывать их мазями жирами маслами","Если на пострадавшем загорелось одежда (кроме насыщения кислородом), нужно быстро набросить на него любую плотную ткань или сбить пламя водой","При небольших по площади ожогах первой и второй степеней нужно наложить на обожженный участок кожи стерильную повязку","Нельзя вскрывать пузыри, удалять приставшую к обожженному месту мастику канифоль и другие смолистые вещества","При тяжелых и обширных ожогах необходимо срочно вызвать скорую медицинскую помощь, пострадавшему необходимо создать покой до прибытия медицинских работников, не раздевая его, укрыть потеплее, напоить теплым чаем, если нет нарушение сознания"],"c":[0,1,2,3,4],"t":"multi"},{"q":"Какие действия при освобождении пострадавшего от действия эл.тока?","o":["спасать"],"c":[0],"t":"single"},{"q":"Какие дополнительные обязанности разрешается выполнять работникам ответственным за безопасное ведение работ? Выберите все правильные ответы (ПОТЭЭ п.5.13)","o":["Выдающий наряд – производитель работ","Производитель работ – допускающий (в электроустановках, не имеющих местного оперативного персонала)","Выдающий наряд - наблюдающий","Допускающий из числа оперативного персонала – член бригады","Допускающий – выдающий разрешение на подготовку и допуск"],"c":[0,3,4],"t":"multi"},{"q":"Какие записи должны быть в оперативном журнале об установке т снятии ПЗ и включении ЗН? Выберите все правильные ответы (СТП-ПБ-3.3.10 прил. 19)","o":["При сдаче смены указываются сведения об установленных заземлениях и заземляющих ножах, с указанием места установки и знаками «молния» стрелками вниз","При снятии ПЗ в графе 3 ставиться знаки «молния» стрелками вверх","Количество знаков «молния» должно соответствовать количеству установленных при снятых переносных заземлений","При установке ПЗ в графе 1 ставиться знаки «молния» стрелками вниз","При включении ЗН в ЭУ выше 1000 В в графе 3 должны быть указана фамилия второго работника"],"c":[2,3,4],"t":"multi"},{"q":"Какие меры должны быть выполнены для включения электродвигателя с целью опробования при работе на нем по наряду?","o":["Бригада должна быть удалена с рабочего места","Наряд должен быть закрыт","Должно быть оформлено окончание работ по наряду","Наряд должен быть сдан оперативному персоналу"],"c":[0,2,3],"t":"multi"},{"q":"Какие меры должны быть выполнены при установке заземлений. Выберите все правильные","o":["Переносное заземление сначала нужно присоединить к заземляющему устройству, а затем, после проверки отсутствия напряжения, установить на токоведущие части","Снимать переносное заземление необходимо в последовательности: сначала отсоединить от заземляющего устройства, а затем снять его с токоведущих частей","Установка и снятие переносных заземлений должны выполняться в диэлектрических перчатках с применением в электроустановках напряжением выше 1000 В изолирующей штанги","Устанавливать заземления на токоведущие части необходимо непосредственно после проверки отсутствия напряжения"],"c":[0,2,3],"t":"multi"},{"q":"Какие надписи должны быть в РУ? Выберите все правильные ответы (ПТЭЭП 2.2.20)","o":["На дверях и внутренних стенках камер ЗРУ, сборках, а также на лицевой и оборотной сторонах панелей щитов должны быть выполнены надписи, указывающие назначений и их диспетчерское наименование","На предохранительных щитках и у предохранителей присоединений должны быть надписи, указывающие номинальный ток плавкой вставки","На дверях РУ должны быть предупреждающие плакаты и знаки установленного образца","На каждой трансформаторной подстанции 10\\0,4 кВ, находящейся на территории Потребителя, должно быть нанесено ее наименование, адрес и телефон владельца"],"c":[0,1,2],"t":"multi"},{"q":"Какие плакаты из перечисленных относятся к предупреждающим?","o":["-Стой! Напряжение!"],"c":[0],"t":"single"},{"q":"Какие СЗ не подлежат нумерации? Выберите все правильные ответы","o":["Диэлектрические ковры","Переносные заземления","Плакаты безопасности","Диэлектрические галоши"],"c":[0,2],"t":"multi"},{"q":"Какие СЗ подлежат периодическим испытаниям? Выберите все правильные ответы (ИПИСЗ п.1.4.4)","o":["Диэлектрические галоши","Изолирующие подставки","Диэлектрические ковры","Клещи электроизмерительные","инструмент ручной изолирующий с однослойной изоляцией"],"c":[0,3,4],"t":"multi"},{"q":"Какие требования к оперативному обслуживанию электроустановок указаны верно? Выберите все правильные","o":["В электроустановках напряжением выше 1000 В в смене должно быть не менее двух работников.","В электроустановках напряжением выше 1000 В работник, единолично обслуживающий электроустановки, должен иметь группу по электробезопасности IV","В электроустановках напряжением выше 1000 В работник, обслуживающий электроустановки, должен иметь группу по электробезопасности IV","В электроустановках напряжением до 1000 В работник, единолично обслуживающий электроустановки, должен иметь группу по электробезопасности III","Число работников в смене определяется ОРД"],"c":[1,3,4],"t":"multi"},{"q":"Какие требования предъявляются к переносным электроприёмникам, используемым в подразделении?","o":["- Должны быть учтены проходить проверку и испытания в сроки и объемах;","- Для поддержания исправного состояния, проведения периодических испытаний и проверок распоряжением руководителя организации должен быть назначен ответственный работник, имеющий группу III"],"c":[0,1],"t":"multi"},{"q":"Какие требования предъявляются к производителю работ в тех случаях, когда он совмещает обязанности допускающего? (ПОТЭЭ п. 10.2)","o":["Подготовку рабочего места он должен выполнять с одним из членов бригады, имеющим группу III","Дополнительных требований не предъявляется","Подготовку рабочего места он должен выполнять с одним из членов бригады из числа оперативно-ремонтного персонала, имеющим группу III","Подготовку рабочего места, с разрешения оперативного персонала, он должен выполнять совместно с ответственным руководителем работ"],"c":[0],"t":"single"},{"q":"Какие требования предъявляются к хранению СЗ? Выберите все правильные ответы (ИПИСЗ п.1.3)","o":["Изолирующие штанги и указатели напряжения следует хранит в горизонтальном положении на специальных кронштейнах, поддерживающих их концы","СЗ из резины следует хранить в сухом помещении, вдали от воздействия солнечных лучей и нагревательных приборов","СЗ из резины следует хранить в шкафах, стеллажах и полках","СЗ нельзя хранить в ящиках, сумках","СЗ из резины должны быть защищены от воздействия разрушающих веществ (масел, бензина)"],"c":[1,2,4],"t":"multi"},{"q":"Какие требования предъявляются к электродвигателям? Выберите все правильные ответы","o":["На электродвигатели должны быть нанесены стрелки, указывающие направление вращения","На приводимые электродвигателями механизмы должны быть нанесены стрелки, указывающие направление вращения","На электродвигателях и пускорегулирующих устройствах должны быть надписи с наименованием агрегата и (или) механизма, к которому они относятся.","Плавкие вставки предохранителей должны быть калиброванными и иметь клеймо с указанием номинального тока уставки"],"c":[0,1,2,3],"t":"multi"},{"q":"Какие требования предъявляются при снятии и установке предохранителей? Выберите все правильные","o":["1. Снимать и устанавливать предохранители следует при снятом напряжении.","2. Допускается снимать и устанавливать предохранители, находящиеся под напряжением, но без нагрузки.","3. Под напряжением и под нагрузкой допускается заменять предохранители пробочного типа напряжения;","4. в электроустановках напряжением до 1000 В пользоваться изолирующими клещами, диэлектрическими перчатками и средствами защиты лица"],"c":[0,1,2,3],"t":"multi"},{"q":"Какие требования при выполнении работ по одному наряду на разных рабочих местах одной электроустановки. Выберите все правильные (ПОТЭЭ пп.З.10, 3.11)","o":["Снимать и устанавливать предохранители следует при снятом напряжении","Допускается снимать и устанавливать предохранители, находящиеся под напряжением, но без нагрузки","Снятие и установку предохранителей под напряжением в электроустановках напряжением выше 1000 В необходимо выполнять в диэлектрических перчатках с применением средств защиты лица.","Снятие и установку предохранителей под напряжением в электроустановках напряжением до 1000 В необходимо выполнять изолирующими клещами, диэлектрическими перчатками и средствами защиты лица.","Допускается заменять предохранители пробочного типа, находящиеся под напряжением и под нагрузкой"],"c":[0,1,3,4],"t":"multi"},{"q":"Какие требования при выполнении работ const KEY = 'elektro_quiz_v1';

let state = load() || { idx: 0, answers: {}, checked: false };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (typeof s.idx !== 'number' || s.idx < 0 || s.idx >= DATA.length) return null;
    return { idx: s.idx, answers: s.answers || {}, checked: !!s.checked };
  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const $ = (id) => document.getElementById(id);
const isMulti = (q) => q.t === 'multi';
const isOrder = (q) => q.t === 'order';

function seedShuffle(n, seed) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push(i);
  let x = seed * 9301 + 49297;
  for (let i = n - 1; i > 0; i--) {
    x = (x * 9301 + 49297) % 233280;
    const j = Math.floor((x / 233280) * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function ensure(i) {
  if (state.answers[i] === undefined) {
    state.answers[i] = isOrder(DATA[i]) ? seedShuffle(DATA[i].o.length, i + 7) : [];
    save();
  }
}

function selected() {
  ensure(state.idx);
  const a = state.answers[state.idx];
  return Array.isArray(a) ? a.slice() : (a === undefined ? [] : [a]);
}

function toggle(i) {
  if (state.checked || isOrder(DATA[state.idx])) return;
  const q = DATA[state.idx];
  let sel = selected();
  if (isMulti(q)) sel = sel.includes(i) ? sel.filter(x => x !== i) : sel.concat(i);
  else sel = [i];
  state.answers[state.idx] = sel;
  save();
  render();
}

function move(pos, dir) {
  if (state.checked) return;
  const arr = selected();
  const j = pos + dir;
  if (j < 0 || j >= arr.length) return;
  const t = arr[pos]; arr[pos] = arr[j]; arr[j] = t;
  state.answers[state.idx] = arr;
  save();
  render();
}

function correctSet(q) { return new Set(q.c); }

function rightFor(q, ans) {
  const sel = Array.isArray(ans) ? ans : (ans === undefined ? [] : [ans]);
  if (isOrder(q)) return sel.length === q.c.length && sel.every((v, i) => v === q.c[i]);
  const want = correctSet(q);
  return sel.length === want.size && sel.every(i => want.has(i));
}

function isRight() { return rightFor(DATA[state.idx], selected()); }

function renderOptions() {
  const q = DATA[state.idx];
  const sel = selected();
  const want = correctSet(q);
  const box = $('opts');
  box.innerHTML = '';

  if (isOrder(q)) {
    sel.forEach((itemIdx, pos) => {
      const row = document.createElement('div');
      row.className = 'opt order';
      if (state.checked) row.classList.add(itemIdx === q.c[pos] ? 'ok' : 'bad');
      const num = document.createElement('div');
      num.className = 'mark';
      num.textContent = String(pos + 1);
      const span = document.createElement('div');
      span.className = 'grow';
      span.textContent = q.o[itemIdx];
      const ctr = document.createElement('div');
      ctr.className = 'arrows';
      const up = document.createElement('button');
      up.className = 'arrow';
      up.textContent = '↑';
      up.disabled = state.checked || pos === 0;
      up.onclick = (e) => { e.stopPropagation(); move(pos, -1); };
      const down = document.createElement('button');
      down.className = 'arrow';
      down.textContent = '↓';
      down.disabled = state.checked || pos === sel.length - 1;
      down.onclick = (e) => { e.stopPropagation(); move(pos, 1); };
      ctr.appendChild(up);
      ctr.appendChild(down);
      row.appendChild(num);
      row.appendChild(span);
      row.appendChild(ctr);
      box.appendChild(row);
    });
    return;
  }

  q.o.forEach((text, i) => {
    const el = document.createElement('div');
    el.className = 'opt';
    if (sel.includes(i)) el.classList.add('sel');
    if (state.checked) {
      if (want.has(i)) el.classList.add('ok');
      else if (sel.includes(i)) el.classList.add('bad');
      else el.classList.add('dim');
    }
    const mark = document.createElement('div');
    mark.className = 'mark';
    if (state.checked && want.has(i)) mark.textContent = '✓';
    else if (sel.includes(i)) mark.textContent = '•';
    const span = document.createElement('div');
    span.className = 'grow';
    span.textContent = text;
    el.appendChild(mark);
    el.appendChild(span);
    el.onclick = () => toggle(i);
    box.appendChild(el);
  });
}

function render() {
  const q = DATA[state.idx];
  ensure(state.idx);
  $('counter').textContent = `Вопрос ${state.idx + 1} из ${DATA.length}`;
  $('hint').textContent = isOrder(q) ? 'Расставьте по порядку' : (isMulti(q) ? 'Выберите все правильные' : 'Один правильный ответ');
  $('qtext').textContent = q.q;
  $('bar').style.width = ((state.idx + (state.checked ? 1 : 0)) / DATA.length * 100) + '%';
  renderOptions();

  const fb = $('fb');
  if (state.checked) {
    const ok = isRight();
    fb.className = 'fb ' + (ok ? 'ok' : 'bad');
    if (ok) {
      fb.textContent = 'Верно';
    } else if (isOrder(q)) {
      fb.textContent = 'Неверно. Правильный порядок: ' +
        q.c.map((itemIdx, i) => `${i + 1}) ${q.o[itemIdx]}`).join(' · ');
    } else {
      fb.textContent = 'Неверно. Правильные варианты подсвечены.';
    }
  } else {
    fb.className = 'fb';
    fb.textContent = '';
  }

  $('check').disabled = state.checked || (!isOrder(q) && selected().length === 0);
  $('next').textContent = state.idx === DATA.length - 1 ? 'Итог' : 'Далее';
  save();
}

function check() {
  if (state.checked) return;
  if (!isOrder(DATA[state.idx]) && selected().length === 0) return;
  state.checked = true;
  render();
}

function next() {
  if (!state.checked) { check(); return; }
  if (state.idx < DATA.length - 1) {
    state.idx++;
    state.checked = false;
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showScore();
  }
}

function showScore() {
  let right = 0;
  DATA.forEach((q, i) => { if (rightFor(q, state.answers[i])) right++; });
  const pct = Math.round(right / DATA.length * 100);
  $('qtext').textContent = 'Итог';
  $('hint').textContent = '';
  $('opts').innerHTML = '';
  const fb = $('fb');
  fb.className = 'fb ' + (pct >= 80 ? 'ok' : 'bad');
  fb.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'score';
  div.textContent = `Правильно ${right} из ${DATA.length} — ${pct}%`;
  fb.appendChild(div);
  $('check').disabled = true;
  $('next').disabled = true;
}

function resetAll() {
  state = { idx: 0, answers: {}, checked: false };
  save();
  $('next').disabled = false;
  $('check').disabled = false;
  render();
}

$('check').onclick = check;
$('next').onclick = next;
$('reset').onclick = resetAll;

function renderAll(filter) {
  const box = $('allList');
  box.innerHTML = '';
  const f = (filter || '').toLowerCase();
  DATA.forEach((q, i) => {
    if (f && !(q.q.toLowerCase().includes(f) || q.o.join(' ').toLowerCase().includes(f))) return;
    const item = document.createElement('div');
    item.className = 'list-item';
    const t = document.createElement('div');
    t.className = 'list-q';
    t.textContent = `${i + 1}. ${q.q}`;
    item.appendChild(t);
    q.o.forEach((o, j) => {
      const d = document.createElement('div');
      const isC = q.c.includes(j);
      d.className = 'list-opt' + (isC ? ' c' : '');
      const pos = isOrder(q) ? ` (${q.c.indexOf(j) + 1}-й шаг)` : '';
      d.textContent = (isC ? '✓ ' : '· ') + o + pos;
      item.appendChild(d);
    });
    box.appendChild(item);
  });
}

$('search').oninput = (e) => renderAll(e.target.value);
$('tabTest').onclick = () => {
  $('viewTest').classList.remove('hidden');
  $('viewAll').classList.add('hidden');
  $('tabTest').classList.add('on');
  $('tabAll').classList.remove('on');
};
$('tabAll').onclick = () => {
  $('viewAll').classList.remove('hidden');
  $('viewTest').classList.add('hidden');
  $('tabAll').classList.add('on');
  $('tabTest').classList.remove('on');
  renderAll($('search').value);
};

render();
</script>
